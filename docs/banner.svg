<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" width="1200" height="330" role="img" aria-label="Lúmen — cabine de projeção para o culto">
  <defs>
    <linearGradient id="chao" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1a1d"/>
      <stop offset="1" stop-color="#111113"/>
    </linearGradient>
    <linearGradient id="facho" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#eba63f" stop-opacity="0.42"/>
      <stop offset="0.55" stop-color="#eba63f" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#eba63f" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#eba63f" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#eba63f" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="330" fill="url(#chao)"/>

  <!-- o facho: a coisa que o app faz é pôr luz numa parede escura -->
  <path d="M212 150 L1200 34 L1200 296 L212 180 Z" fill="url(#facho)"/>
  <circle cx="212" cy="165" r="96" fill="url(#halo)"/>

  <!-- a marca: projetor com o cone de luz -->
  <g transform="translate(120 97) scale(4.25)">
    <rect width="32" height="32" rx="8" fill="#e9e8e5"/>
    <rect x="7" y="6" width="18" height="12" rx="2" fill="#141416"/>
    <rect x="10" y="9" width="12" height="2.4" rx="1" fill="#c9d0db"/>
    <rect x="12" y="13" width="8" height="2" rx="1" fill="#c9d0db"/>
    <path d="M16 18 L11 27 H21 Z" fill="#141416"/>
    <circle cx="22.5" cy="8.5" r="1.7" fill="#eba63f"/>
  </g>

  <!-- tally: o ponto que diz que algo está no ar -->
  <circle cx="322" cy="97" r="4" fill="#eba63f"/>
  <text x="338" y="102" font-family="'Instrument Sans','Segoe UI',system-ui,sans-serif"
        font-size="15" font-weight="600" letter-spacing="1.4" fill="#eba63f">NO AR</text>

  <text x="320" y="182" font-family="Fraunces,Georgia,serif"
        font-size="76" font-weight="600" fill="#ecebe8">Lúmen</text>

  <text x="324" y="228" font-family="'Instrument Sans','Segoe UI',system-ui,sans-serif"
        font-size="23" fill="#aeada9">Cabine de projeção para o culto</text>

  <g font-family="'Instrument Sans','Segoe UI',system-ui,sans-serif" font-size="15" fill="#8e8d89">
    <text x="324" y="272">Letras</text>
    <text x="404" y="272">Bíblia offline</text>
    <text x="536" y="272">Segundo monitor</text>
    <text x="696" y="272">33 temas</text>
    <text x="790" y="272">Windows</text>
  </g>
  <g fill="#3a3a41">
    <circle cx="392" cy="267" r="2"/>
    <circle cx="524" cy="267" r="2"/>
    <circle cx="684" cy="267" r="2"/>
    <circle cx="778" cy="267" r="2"/>
  </g>

  <rect x="0" y="326" width="1200" height="4" fill="#eba63f" opacity="0.85"/>
</svg>
